<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>나는 어떤 마법사일까? 초등 MBTI 테스트</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700;800&family=Gaegu:wght@400;700&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --purple-50: #EEEDFE;
    --purple-200: #AFA9EC;
    --purple-600: #534AB7;
    --purple-800: #3C3489;
    --teal-50: #E1F5EE;
    --teal-600: #0F6E56;
    --amber-50: #FAEEDA;
    --amber-600: #854F0B;
    --pink-50: #FBEAF0;
    --pink-600: #993556;
    --blue-50: #E6F1FB;
    --blue-600: #185FA5;
    --green-50: #EAF3DE;
    --green-600: #3B6D11;
    --coral-50: #FAECE7;
    --coral-600: #993C1D;
    --bg: #faf9f7;
    --surface: #ffffff;
    --border: rgba(0,0,0,0.09);
    --text: #1a1a1a;
    --text-sub: #6b6b6b;
    --radius-md: 10px;
    --radius-lg: 16px;
    --radius-xl: 24px;
  }

  body {
    font-family: 'Nanum Gothic', sans-serif;
    background: var(--bg);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem 1rem;
    background-image: radial-gradient(circle at 20% 20%, rgba(83,74,183,0.06) 0%, transparent 50%),
                      radial-gradient(circle at 80% 80%, rgba(175,169,236,0.08) 0%, transparent 50%);
  }

  #app {
    width: 100%;
    max-width: 500px;
  }

  .screen { display: none; }
  .screen.active { display: block; }

  /* ── Start Screen ── */
  .start-wrap {
    background: var(--surface);
    border-radius: var(--radius-xl);
    border: 1px solid var(--border);
    padding: 2.5rem 2rem;
    text-align: center;
  }

  .star-deco {
    display: flex; justify-content: center; gap: 6px; margin-bottom: 1rem;
  }
  .star-deco span {
    display: inline-block; width: 8px; height: 8px; border-radius: 50%;
    animation: twinkle 2s infinite;
  }
  .star-deco span:nth-child(1){ background: #FAC775; animation-delay: 0s; }
  .star-deco span:nth-child(2){ background: #AFA9EC; animation-delay: .4s; width:12px;height:12px; }
  .star-deco span:nth-child(3){ background: #5DCAA5; animation-delay: .8s; }
  @keyframes twinkle { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.4;transform:scale(.7)} }

  .wizard-icon {
    width: 110px; height: 110px; background: var(--purple-50);
    border-radius: 50%; margin: 0 auto 1.5rem;
    display: flex; align-items: center; justify-content: center;
    border: 2px solid var(--purple-200);
    animation: float 3s ease-in-out infinite;
  }
  @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }

  .title-big {
    font-family: 'Gaegu', cursive;
    font-size: 30px; font-weight: 700;
    color: var(--text); margin-bottom: .5rem; line-height: 1.3;
  }
  .subtitle {
    font-size: 14px; color: var(--text-sub); line-height: 1.8; margin-bottom: 2rem;
  }
  .subtitle strong { color: var(--purple-600); font-weight: 700; }

  .start-btn {
    background: var(--purple-600); color: white;
    border: none; border-radius: 99px;
    padding: 14px 40px; font-size: 16px; font-weight: 700;
    font-family: 'Nanum Gothic', sans-serif;
    cursor: pointer; transition: all .2s;
    letter-spacing: .5px;
  }
  .start-btn:hover { background: var(--purple-800); transform: translateY(-2px); box-shadow: 0 8px 20px rgba(83,74,183,.3); }
  .start-btn:active { transform: translateY(0); }

  /* ── Quiz Screen ── */
  .quiz-wrap {
    background: var(--surface);
    border-radius: var(--radius-xl);
    border: 1px solid var(--border);
    padding: 2rem 1.75rem 2.5rem;
  }

  .prog-wrap {
    background: #f0eeff; border-radius: 99px; height: 8px; margin-bottom: 1.25rem;
    overflow: hidden;
  }
  .prog-fill {
    height: 100%; border-radius: 99px;
    background: linear-gradient(90deg, var(--purple-200), var(--purple-600));
    transition: width .5s cubic-bezier(.4,0,.2,1);
  }

  .q-meta {
    display: flex; justify-content: space-between;
    align-items: center; margin-bottom: 1rem;
  }
  .q-label { font-size: 12px; color: var(--text-sub); font-weight: 700; }
  .q-dim {
    font-size: 11px; color: var(--purple-600);
    background: var(--purple-50); padding: 3px 10px;
    border-radius: 99px; font-weight: 700;
  }

  .q-text {
    font-family: 'Gaegu', cursive;
    font-size: 20px; font-weight: 700;
    color: var(--text); margin-bottom: 1.5rem;
    line-height: 1.5; text-align: center;
  }

  .opts { display: grid; gap: 10px; }
  .opt-btn {
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 14px 16px; font-size: 14px;
    color: var(--text); cursor: pointer;
    transition: all .18s; text-align: left;
    display: flex; align-items: center; gap: 12px;
    font-family: 'Nanum Gothic', sans-serif;
    font-weight: 700;
  }
  .opt-btn:hover {
    border-color: var(--purple-200);
    background: var(--purple-50);
    color: var(--purple-800);
    transform: translateX(4px);
  }
  .opt-btn:active { transform: translateX(2px) scale(.99); }

  .opt-icon {
    width: 40px; height: 40px; border-radius: var(--radius-md);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; font-size: 15px; font-weight: 800;
    font-family: 'Gaegu', cursive;
  }

  /* ── Result Screen ── */
  .result-wrap {}

  .result-header {
    background: var(--surface);
    border-radius: var(--radius-xl);
    border: 1px solid var(--border);
    padding: 2rem 1.75rem;
    text-align: center;
    margin-bottom: 1rem;
  }

  .type-badge {
    display: inline-block; padding: 4px 16px;
    background: var(--purple-50); color: var(--purple-800);
    border-radius: 99px; font-size: 13px; font-weight: 800;
    margin-bottom: .75rem; letter-spacing: 2px;
    border: 1px solid var(--purple-200);
  }

  .wizard-name {
    font-family: 'Gaegu', cursive;
    font-size: 28px; font-weight: 700; color: var(--text);
    margin-bottom: .5rem;
  }

  .wizard-desc {
    font-size: 13px; color: var(--text-sub);
    line-height: 1.8; margin-bottom: 1rem;
  }

  .trait-row { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
  .trait {
    padding: 4px 12px; border-radius: 99px;
    font-size: 11px; font-weight: 800;
  }

  .score-card {
    background: var(--surface);
    border-radius: var(--radius-xl);
    border: 1px solid var(--border);
    padding: 1.25rem 1.5rem;
    margin-bottom: 1rem;
  }
  .score-grid { display: grid; gap: 12px; }
  .score-row { display: grid; gap: 6px; }
  .score-top {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 12px; font-weight: 800; color: var(--text);
  }
  .score-sub { color: var(--text-sub); font-weight: 700; }
  .score-bar {
    height: 9px; border-radius: 99px; overflow: hidden;
    background: var(--bg); border: 1px solid var(--border);
  }
  .score-fill {
    height: 100%; border-radius: 99px;
    background: linear-gradient(90deg, var(--purple-300), var(--purple-600));
  }

  .section-label {
    font-size: 12px; font-weight: 800; color: var(--text-sub);
    margin-bottom: 8px; letter-spacing: .5px;
    display: flex; align-items: center; gap: 6px;
  }
  .section-label::before {
    content: ''; display: inline-block;
    width: 4px; height: 4px; border-radius: 50%;
    background: var(--purple-600);
  }

  .pet-card {
    background: var(--surface);
    border-radius: var(--radius-xl);
    border: 1px solid var(--border);
    padding: 1.5rem 1.75rem;
    margin-bottom: 1rem;
  }

  .pet-loading {
    text-align: center; padding: 1.5rem 0;
  }
  .loading-text {
    font-size: 13px; color: var(--text-sub);
    margin-bottom: 12px; font-weight: 700;
  }
  .loading-dots { display: flex; justify-content: center; gap: 8px; }
  .loading-dots span {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--purple-200); display: inline-block;
    animation: bounce .9s infinite;
  }
  .loading-dots span:nth-child(2){ animation-delay:.15s }
  .loading-dots span:nth-child(3){ animation-delay:.3s }
  @keyframes bounce { 0%,60%,100%{transform:translateY(0)} 30%{transform:translateY(-8px)} }

  .pet-header {
    display: flex; align-items: center; gap: 14px; margin-bottom: 1rem;
  }
  .pet-orb {
    width: 60px; height: 60px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; border: 2px solid rgba(0,0,0,.07);
  }
  .pet-name-wrap {}
  .pet-name {
    font-family: 'Gaegu', cursive;
    font-size: 20px; font-weight: 700; color: var(--text);
  }
  .pet-kind { font-size: 12px; color: var(--text-sub); font-weight: 700; margin-top: 2px; }

  .pet-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .pet-item {
    background: var(--bg); border-radius: var(--radius-md);
    padding: 10px 12px; border: 1px solid var(--border);
  }
  .pet-item-label { font-size: 10px; color: var(--text-sub); font-weight: 800; margin-bottom: 4px; letter-spacing: .5px; }
  .pet-item-val { font-size: 12px; color: var(--text); line-height: 1.6; font-weight: 700; }
  .pet-bond {
    background: var(--purple-50); border-radius: var(--radius-md);
    padding: 10px 12px; margin-top: 8px;
    border: 1px solid var(--purple-200);
  }
  .pet-bond-label { font-size: 10px; color: var(--purple-600); font-weight: 800; margin-bottom: 4px; letter-spacing: .5px; }
  .pet-bond-val { font-size: 12px; color: var(--purple-800); line-height: 1.6; font-weight: 700; }

  .pet-error {
    background: #fff0f0; border-radius: var(--radius-md);
    padding: 12px; font-size: 13px; color: #991f1f; font-weight: 700;
    border: 1px solid #fecaca;
  }

  .action-wrap { display: grid; gap: 8px; margin-top: .5rem; }
  .action-btn {
    width: 100%; border-radius: 99px;
    padding: 13px 24px; font-size: 14px; font-weight: 800;
    font-family: 'Nanum Gothic', sans-serif;
    cursor: pointer; transition: all .18s; border: none;
  }
  .action-primary { background: var(--purple-600); color: white; }
  .action-primary:hover { background: var(--purple-800); transform: translateY(-1px); }
  .action-secondary {
    background: transparent; color: var(--text-sub);
    border: 1.5px solid var(--border);
  }
  .action-secondary:hover { background: var(--purple-50); border-color: var(--purple-200); color: var(--purple-800); }

  /* Confetti on result */
  .confetti-wrap { position: relative; overflow: hidden; border-radius: var(--radius-xl); }
  .confetti-dot {
    position: absolute; border-radius: 50%; pointer-events: none;
    animation: confetti-fall 2s ease-out forwards;
  }
  @keyframes confetti-fall {
    0%{opacity:1;transform:translateY(-20px) rotate(0deg)}
    100%{opacity:0;transform:translateY(80px) rotate(360deg)}
  }
</style>
</head>

<div id="app">
  <!-- START -->
  <div id="screen-start" class="screen active">
    <div class="start-wrap">

      <div class="opts" id="q-opts"></div>
    </div>
  </div>

  <!-- RESULT -->
  <div id="screen-result" class="screen">
    <div class="result-header confetti-wrap" id="result-header">
      <div class="type-badge" id="r-type"></div>
      <div class="wizard-name" id="r-name"></div>
      <div class="wizard-desc" id="r-desc"></div>
      <div class="trait-row" id="r-traits"></div>
    </div>

    <div class="section-label">나의 성향 점수</div>
    <div class="score-card">
      <div class="score-grid" id="r-scores"></div>
    </div>

    <div class="section-label">나의 마법 펫 (AI 추천)</div>
    <div class="pet-card">
      <div class="pet-loading" id="pet-loading">
        <div class="loading-text">마법 세계에서 너만의 펫을 찾는 중...</div>
        <div class="loading-dots"><span></span><span></span><span></span></div>
      </div>
      <div id="pet-result" style="display:none"></div>
    </div>

    <div class="action-wrap">
      <button class="action-btn action-primary" onclick="restart()">처음부터 다시 하기</button>
    </div>
  </div>
</div>

  ENTP:{name:'아이디어 마법사',desc:'궁금한 게 많고 새로운 방법을 잘 떠올려. 친구들과 이야기하면서 더 재미있는 생각을 만들어내.',traits:['아이디어','말솜씨','도전'],tc:['#EEEDFE|#534AB7','#E6F1FB|#185FA5','#FAECE7|#993C1D']},
  ENTJ:{name:'리더 마법사',desc:'목표가 생기면 앞장서서 이끌어. 어떻게 하면 더 잘할 수 있을지 빠르게 정하는 타입이야.',traits:['리더','자신감','계획'],tc:['#E6F1FB|#185FA5','#EAF3DE|#3B6D11','#EEEDFE|#534AB7']},
  ESFP:{name:'반짝 마법사',desc:'분위기를 밝게 만드는 재주가 있어. 즐거운 일이 있으면 친구들과 함께 나누고 싶어 해.',traits:['신남','웃음','행동'],tc:['#FBEAF0|#993556','#E1F5EE|#0F6E56','#FAECE7|#993C1D']},

  ESTP:{name:'모험 마법사',desc:'가만히 있기보다 직접 해보는 걸 좋아해. 어려운 일이 와도 몸으로 부딪치며 해결하는 타입이야.',traits:['용기','행동','재미'],tc:['#E6F1FB|#185FA5','#FAECE7|#993C1D','#EAF3DE|#3B6D11']},
  ESTJ:{name:'반장 마법사',desc:'규칙을 잘 지키고 맡은 일을 끝까지 해내. 친구들이 믿고 맡길 수 있는 든든한 마법사야.',traits:['책임','정리','믿음'],tc:['#EAF3DE|#3B6D11','#E6F1FB|#185FA5','#EEEDFE|#534AB7']},
  INFP:{name:'꿈빛 마법사',desc:'마음속에 멋진 이야기가 많아. 조용해 보여도 좋아하는 일에는 깊이 빠지는 타입이야.',traits:['상상','감성','소중함'],tc:['#FBEAF0|#993556','#EEEDFE|#534AB7','#E1F5EE|#0F6E56']},
  INFJ:{name:'비밀별 마법사',desc:'친구 마음을 잘 알아차리고 깊이 생각해. 조용히 좋은 변화를 만들고 싶어 하는 타입이야.',traits:['생각','공감','집중'],tc:['#EEEDFE|#534AB7','#E1F5EE|#0F6E56','#FBEAF0|#993556']},
  INTP:{name:'탐구 마법사',desc:'왜 그런지 궁금해하고 원리를 알고 싶어 해. 혼자 생각하며 새로운 답을 찾는 걸 좋아해.',traits:['궁금증','논리','연구'],tc:['#EEEDFE|#534AB7','#E6F1FB|#185FA5','#FAEEDA|#854F0B']},
  INTJ:{name:'작전 마법사',desc:'머릿속으로 방법을 세우고 차근차근 해내. 혼자서도 목표를 향해 잘 나아가는 타입이야.',traits:['작전','집중','끈기'],tc:['#EEEDFE|#534AB7','#E6F1FB|#185FA5','#EAF3DE|#3B6D11']},
  ISFP:{name:'그림 마법사',desc:'예쁜 것과 재미있는 표현을 좋아해. 말보다 행동이나 작품으로 마음을 보여주는 타입이야.',traits:['예술','자유','온화'],tc:['#FBEAF0|#993556','#EAF3DE|#3B6D11','#FAEEDA|#854F0B']},
  ISFJ:{name:'수호 마법사',desc:'친구가 좋아하는 것과 필요한 걸 잘 기억해. 조용하지만 꾸준히 도와주는 따뜻한 타입이야.',traits:['기억','친절','안정'],tc:['#E1F5EE|#0F6E56','#FBEAF0|#993556','#FAEEDA|#854F0B']},
  ISTP:{name:'뚝딱 마법사',desc:'도구를 만지고 직접 고쳐보는 걸 좋아해. 말보다 손으로 해결하는 멋진 타입이야.',traits:['손재주','침착','실험'],tc:['#E6F1FB|#185FA5','#EEEDFE|#534AB7','#FAECE7|#993C1D']},
  ISTJ:{name:'기록 마법사',desc:'꼼꼼하고 맡은 일을 잘 지켜. 천천히 해도 정확하게 끝내는 믿음직한 타입이야.',traits:['꼼꼼','성실','차분'],tc:['#EAF3DE|#3B6D11','#E6F1FB|#185FA5','#EEEDFE|#534AB7']},
};

let scores = {E:0,I:0,S:0,N:0,T:0,F:0,J:0,P:0};
let cur = 0;

function startQuiz(){
  scores = {E:0,I:0,S:0,N:0,T:0,F:0,J:0,P:0};
  cur = 0;
  show('screen-quiz');
  renderQ();
}

function renderQ(){
  const q = QS[cur];
  document.getElementById('q-label').textContent = `질문 ${cur+1} / ${QS.length}`;
  document.getElementById('q-dim').textContent = q.label;
  document.getElementById('q-text').textContent = q.text;
  document.getElementById('prog').style.width = ((cur / QS.length) * 100) + '%';
  document.getElementById('q-opts').innerHTML = `
    <button class="opt-btn" onclick="ans('a')">
      <div class="opt-icon" style="background:${q.a.bg};color:${q.a.tc}">A</div>
      <span>${q.a.t}</span>
    </button>
    <button class="opt-btn" onclick="ans('b')">
      <div class="opt-icon" style="background:${q.b.bg};color:${q.b.tc}">B</div>
      <span>${q.b.t}</span>
    </button>`;
}

function ans(c){
  const q = QS[cur];
  if(c==='a') scores[q.dim[0]]++; else scores[q.dim[1]]++;
  cur++;
  if(cur < QS.length) renderQ(); else showResult();
}

function pickType(a, b){
  return scores[a] >= scores[b] ? a : b;
}

function axisScore(a, b, label){
  const total = scores[a] + scores[b] || 1;
  const winner = pickType(a, b);
  const loser = winner === a ? b : a;
  const pct = Math.round((scores[winner] / total) * 100);
  return {label, winner, loser, pct};
}

function renderScores(){
  const axes = [
    axisScore('E','I','에너지'),
    axisScore('N','S','생각 방식'),
    axisScore('F','T','결정 방식'),
    axisScore('P','J','생활 방식')
  ];

  document.getElementById('r-scores').innerHTML = axes.map(axis => `
    <div class="score-row">
      <div class="score-top">
        <span>${axis.label} · ${axis.winner}</span>
        <span class="score-sub">${axis.winner} ${axis.pct}% / ${axis.loser} ${100 - axis.pct}%</span>
      </div>
      <div class="score-bar"><div class="score-fill" style="width:${axis.pct}%"></div></div>
    </div>
  `).join('');
}

function showResult(){
  document.getElementById('prog').style.width = '100%';
  const type =
    pickType('E','I') +
    pickType('N','S') +
    pickType('F','T') +
    pickType('P','J');

  const r = TYPES[type] || TYPES['INFP'];
  document.getElementById('r-type').textContent = type;
  document.getElementById('r-name').textContent = r.name;
  document.getElementById('r-desc').textContent = r.desc;
  document.getElementById('r-traits').innerHTML = r.traits.map((t,i) => {
    const [bg, tc] = r.tc[i].split('|');
    return `<span class="trait" style="background:${bg};color:${tc}">${t}</span>`;
  }).join('');
  renderScores();

  show('screen-result');
  spawnConfetti();
  fetchPet(type, r.name, r.traits);
}

function spawnConfetti(){
  const wrap = document.getElementById('result-header');
  const colors = ['#AFA9EC','#FAC775','#9FE1CB','#ED93B1','#85B7EB'];
  for(let i=0;i<12;i++){
    const dot = document.createElement('div');
    dot.className = 'confetti-dot';
    dot.style.cssText = `
      left:${Math.random()*100}%;top:0;
      width:${6+Math.random()*6}px;height:${6+Math.random()*6}px;
      background:${colors[Math.floor(Math.random()*colors.length)]};
      animation-delay:${Math.random()*.5}s;
    `;
    wrap.appendChild(dot);
    setTimeout(()=>dot.remove(), 2500);
  }
}

async function fetchPet(type, wizardName, traits){
  const loading = document.getElementById('pet-loading');
  const result = document.getElementById('pet-result');
  loading.style.display = 'block';
  result.style.display = 'none';

  const prompt = `마법사 유형: ${type} (${wizardName})
성향 키워드: ${traits.join(', ')}

이 마법사에게 딱 맞는 완전히 독창적인 마법 펫을 하나 추천해줘.
다음 JSON 형식으로만 답해줘. 다른 텍스트 없이 JSON만:
{
  "petName": "펫 이름 (창의적인 고유명사)",
  "petKind": "펫 종류 (예: 별빛 여우, 구름 도마뱀, 꿈결 고래 등 창의적으로)",
  "appearance": "외모 묘사 (2문장, 어린이가 이해하기 쉽게)",
  "ability": "특별한 마법 능력 (1문장, 구체적으로)",
  "personality": "성격 특징 (1문장, 마법사와 잘 맞는 이유 포함)",
  "bond": "이 마법사와 함께할 때 특별히 일어나는 일 (1문장)"
}`;

  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 600,
        system: '너는 어린이를 위한 마법 세계 창작 전문가야. 항상 JSON만 출력해. 마크다운 코드블록 없이 순수 JSON만.',
        messages: [{role:'user', content:prompt}]
      })
    });
    const data = await res.json();
    const text = data.content.map(b=>b.text||'').join('');
    const clean = text.replace(/```json|```/g,'').trim();
    const pet = JSON.parse(clean);

    const orbColors = ['#EEEDFE','#E1F5EE','#FAEEDA','#FBEAF0','#E6F1FB','#EAF3DE'];
    const oc = orbColors[Math.floor(Math.random()*orbColors.length)];

    result.innerHTML = `
      <div class="pet-header">
        <div class="pet-orb" style="background:${oc}">
          <svg width="34" height="34" viewBox="0 0 34 34" fill="none">
            <circle cx="17" cy="17" r="15" fill="${oc}"/>
            <circle cx="17" cy="15" r="8" fill="#AFA9EC" opacity=".5"/>
            <circle cx="13.5" cy="13.5" r="2" fill="#3C3489"/>
            <circle cx="20.5" cy="13.5" r="2" fill="#3C3489"/>
            <circle cx="14.2" cy="12.8" r=".8" fill="white"/>
            <circle cx="21.2" cy="12.8" r=".8" fill="white"/>
            <path d="M13 18.5 Q17 21.5 21 18.5" stroke="#3C3489" stroke-width="1.2" fill="none" stroke-linecap="round"/>
          </svg>
        </div>
        <div class="pet-name-wrap">
          <div class="pet-name">${pet.petName}</div>
          <div class="pet-kind">${pet.petKind}</div>
        </div>
      </div>
      <div class="pet-grid">
        <div class="pet-item">
          <div class="pet-item-label">외모</div>
          <div class="pet-item-val">${pet.appearance}</div>
        </div>
        <div class="pet-item">
          <div class="pet-item-label">마법 능력</div>
          <div class="pet-item-val">${pet.ability}</div>
        </div>
        <div class="pet-item">
          <div class="pet-item-label">성격</div>
          <div class="pet-item-val">${pet.personality}</div>
        </div>
        <div class="pet-item">
          <div class="pet-item-label">특별한 인연</div>
          <div class="pet-item-val">${pet.bond}</div>
        </div>
      </div>`;

    loading.style.display = 'none';
    result.style.display = 'block';
  } catch(e) {
    loading.style.display = 'none';
    result.innerHTML = `<div class="pet-error">마법 펫을 불러오지 못했어... 잠시 후 다시 시도해봐!</div>`;
    result.style.display = 'block';
  }
}

function restart(){
  show('screen-start');
}

function show(id){
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}
</script>
